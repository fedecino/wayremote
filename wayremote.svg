<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89b4fa"/>
      <stop offset="50%" stop-color="#cba6f7"/>
      <stop offset="100%" stop-color="#f38ba8"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#313244"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#bg)" stroke="#45475a" stroke-width="3"/>

  <!-- Monitor Frame -->
  <rect x="44" y="52" width="168" height="116" rx="14" fill="url(#screen)" stroke="url(#accent)" stroke-width="4"/>
  
  <!-- Monitor Stand -->
  <path d="M112 168 L104 196 L152 196 L144 168 Z" fill="#45475a"/>
  <rect x="92" y="196" width="72" height="8" rx="4" fill="#585b70"/>

  <!-- Wayland 'W' & Signal Path inside screen -->
  <!-- Stylized Wayland 'W' -->
  <path d="M68 82 L88 140 L108 96 L128 140 L148 82" fill="none" stroke="url(#accent)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Remote Wave / Signal arcs -->
  <path d="M168 90 A 18 18 0 0 1 182 118" fill="none" stroke="#a6e3a1" stroke-width="5" stroke-linecap="round"/>
  <path d="M178 80 A 32 32 0 0 1 200 128" fill="none" stroke="#89dceb" stroke-width="5" stroke-linecap="round"/>

  <!-- Status dot -->
  <circle cx="128" cy="154" r="3" fill="#a6e3a1"/>
</svg>
